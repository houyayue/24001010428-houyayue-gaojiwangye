<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-1 数7游戏（逢七过）</title>
    <!--
      作者：侯雅月
      建立时间：2026-10-26 13:50:02
      使用的大模型：GLM-5.3-Flash
      功能名称：数7游戏（逢七过）
    -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(135deg, #eef6ff, #fffaf0);
            color: #213244;
            padding: 30px 16px 60px;
        }

        .hou_ya_yue_page {
            max-width: 900px;
            margin: 0 auto;
        }

        .hou_ya_yue_header {
            background: linear-gradient(135deg, rgba(29, 95, 166, 0.94), rgba(21, 63, 115, 0.95));
            border-radius: 20px;
            padding: 28px 26px;
            color: #fff;
            box-shadow: 0 18px 40px rgba(29, 95, 166, 0.12);
            margin-bottom: 24px;
        }

        .hou_ya_yue_header h1 {
            font-size: 1.7rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .hou_ya_yue_header p {
            font-size: 0.98rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
        }

        .hou_ya_yue_back {
            display: inline-block;
            margin-top: 14px;
            color: #ffd9a0;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .hou_ya_yue_back:hover {
            text-decoration: underline;
        }

        .hou_ya_yue_toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            background: #fff;
            border: 1px solid #d8e6f5;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 22px;
            box-shadow: 0 10px 25px rgba(17, 24, 39, 0.05);
            font-size: 0.92rem;
        }

        .hou_ya_yue_legend {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .hou_ya_yue_legend-num {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: #fff;
            border: 2px solid #1d5fa6;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #1d5fa6;
            font-weight: 700;
        }

        .hou_ya_yue_legend-empty {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: #f3f6fa;
            border: 2px dashed #b7c6d8;
            display: inline-block;
        }

        .hou_ya_yue_stats {
            margin-left: auto;
            color: #5d6d7e;
        }

        .hou_ya_yue_stats strong {
            color: #1d5fa6;
        }

        .hou_ya_yue_grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
        }

        .hou_ya_yue_box {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hou_ya_yue_box-num {
            background: #fff;
            border: 2px solid #9fc3ea;
            color: #1d5fa6;
            box-shadow: 0 6px 14px rgba(29, 95, 166, 0.08);
        }

        .hou_ya_yue_box-num:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 22px rgba(29, 95, 166, 0.16);
        }

        /* 逢七过：满足规则（7的倍数或含7），显示空盒子 */
        .hou_ya_yue_box-empty {
            background: #f3f6fa;
            border: 2px dashed #b7c6d8;
        }

        .hou_ya_yue_box-empty:hover {
            transform: translateY(-4px);
            border-color: #ff9d2f;
        }

        @media (max-width: 640px) {
            .hou_ya_yue_grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 8px;
            }

            .hou_ya_yue_box {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="hou_ya_yue_page">
        <header class="hou_ya_yue_header">
            <h1>数7游戏（逢七过）</h1>
            <p>
                从 1 到 100 共一百个盒子。按照“数 7”规则：凡是 <strong>7 的倍数</strong>，或者数字中<strong>含有 7</strong>（个位为 7、十位为 7 等）的数，
                都要“跳过”——这些盒子显示为<strong>空盒子</strong>；不满足规则的数字正常显示在盒子里。
            </p>
            <a class="hou_ya_yue_back" href="index.html">← 返回首页</a>
        </header>

        <div class="hou_ya_yue_toolbar">
            <span class="hou_ya_yue_legend">
                <span class="hou_ya_yue_legend-num">8</span>
                正常数字
            </span>
            <span class="hou_ya_yue_legend">
                <span class="hou_ya_yue_legend-empty"></span>
                空盒子（逢七过）
            </span>
            <span class="hou_ya_yue_stats" id="hou_ya_yue_stats"></span>
        </div>

        <main class="hou_ya_yue_grid" id="hou_ya_yue_grid"></main>
    </div>

    <script>
        // 判断是否满足“数7”规则：7 的倍数，或数字中含有 7（个位为 7、十位为 7 等）
        function hou_ya_yue_isPass(hou_ya_yue_num) {
            if (hou_ya_yue_num % 7 === 0) {
                return true;
            }
            return String(hou_ya_yue_num).indexOf('7') !== -1;
        }

        var hou_ya_yue_grid = document.getElementById('hou_ya_yue_grid');
        var hou_ya_yue_emptyCount = 0;
        var hou_ya_yue_html = '';

        for (var hou_ya_yue_i = 1; hou_ya_yue_i <= 100; hou_ya_yue_i++) {
            if (hou_ya_yue_isPass(hou_ya_yue_i)) {
                // 满足规则：显示空盒子
                hou_ya_yue_emptyCount++;
                hou_ya_yue_html += '<div class="hou_ya_yue_box hou_ya_yue_box-empty" title="逢七过：' + hou_ya_yue_i + ' 跳过"></div>';
            } else {
                // 不满足规则：显示数字
                hou_ya_yue_html += '<div class="hou_ya_yue_box hou_ya_yue_box-num" title="正常报数：' + hou_ya_yue_i + '">' + hou_ya_yue_i + '</div>';
            }
        }

        hou_ya_yue_grid.innerHTML = hou_ya_yue_html;
        document.getElementById('hou_ya_yue_stats').innerHTML =
            '共 <strong>100</strong> 个盒子，其中空盒子 <strong>' + hou_ya_yue_emptyCount + '</strong> 个，显示数字 <strong>' + (100 - hou_ya_yue_emptyCount) + '</strong> 个';
    </script>
</body>
</html>
