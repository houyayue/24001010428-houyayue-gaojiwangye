<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>428 侯雅月</title>
    <style>
        /* 标签选择器 h2：黑底白字 */
        h2 {
            color: white;
            background-color: black;
            font-size: 28px;
        }
        p {
            font-size: 18px;
        }
        /* id选择器：原来的盒子 */
        #box {
            width: 300px;
            height: 220px;
            background-color: #b8e1ff;
            color: blue;
            font-size: 20px;
            padding: 10px;
        }
        /* 新增盒子 id选择器 */
        #box2 {
            width: 300px;
            height: 300px;
            background-color: #ffc9c9;
            margin-top: 15px;
        }
        /* 类选择器：名字不同颜色，同一行 */
        .hou {
            color: orange;
        }
        .ya {
            color: purple;
        }
        .yue {
            color: red;
        }
        /* “选择器”三个字：白色文字 */
        .select-text{
            color: white;
            /* 清除继承背景 */
            background: transparent;
        }
    </style>
</head>
<body>
    <h2>层叠样式表</h2>
    <div id="box">
        <p>CSS<span class="select-text">选择器</span></p>
        <!-- 同一行、不同颜色 -->
        <span class="hou">侯</span><span class="ya">雅</span><span class="yue">月</span>
        <p>CSS属性</p>
    </div>
    <!-- 新增宽300高300盒子 -->
    <div id="box2"></div>
</body>
</html>
