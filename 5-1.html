<!DOCTYPE html>
<html lang="en">
<link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.css"></link>
    <style>
        p{
            color: #f00;
            font-size: 100px;
        }
        .text{
            color: green;
        }
        #text{
            color:purple;
        }
        .box p{
            color: orange;
        }
        #box p{
            color: silver;
        }
        .text{
            color: yellow!important;
        }
        /* 优先级:id>class>标签 */
        #box{
            /* 宽400，高400，灰色背景，距离，字间距5px */
            width: 400px;
            height: 400px;
            background-color: #ccc;
            margin: 10px;
            padding: 10px;
            letter-spacing: 25px;
            /* 圆角矩形50% */
            border-radius: 25%;
        }
    </style>
    <!-- 后定义的覆盖前定义的 -->
</head>
<body>
    <h2>层叠与继承</h2>
    <div id="box" class="box">
        <p id="text" class="text">428 侯雅月</p>
        <p>层叠与继承的优先权</p>
    </div>
</body>
</html>
