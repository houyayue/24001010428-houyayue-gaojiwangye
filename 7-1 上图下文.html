<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0; 
        }
        ul{
            list-style: none;
        }
        img{}
        .ilist{
            display: flex;
          
        }
        .ilist li{
            width: 30%;
            margin-right: 3px;
            flex-grow: 1;
            position: relative;
        }
        .ilist img{
            width: 100%;
        }
        .ilist p{
            text-align: center;
            font-size: 14px;
            line-height: 33px;
            /*绝对定位*/
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, .5);
            color: #fff;
        }
    </style>
</head>
<body>
    <ul class="ilist">
        <li>
            <img src="image/1.jpg">
            <p>图片 1</p>
        </li>
        <li>
            <img src="image/2.jpeg">
            <p>图片 2</p>
        </li>
        <li>
            <img src="image/3.jpeg">
            <p>图片 3</p>
        </li>
    </ul>
</body>
</html>
