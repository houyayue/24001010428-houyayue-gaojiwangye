<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            /*背景颜色#f2f3f4*/
            background-color: #f2f3f4;
            display: flex;
            flex-wrap: wrap;
            margin:10px;
        }
        .box{
            width: 150px;
            height: 159px;
            border: 1px solid #ccc;
            margin: 10px;
            background-color: white;
            font-size: 35px;
            display: flex;
            /*水平垂直居中*/
            justify-content: center;
            align-items: center;
            transition: all 0.6s;
            box-sizing: border-box;
            /*width包括了padding和border*/
        }
        .box:first-child:hover{
            background-color: #000;
            color:#fff;
            font-size: 100px;
            border-width:30px;
        }
        .box:nth-child(2):hover{
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
        }
        .box:nth-child(3):hover{
            text-shadow: 100px 0px 20px rgba(0,0,0,0.5);
        }
        .box:nth-child(4):hover{
            border-radius: 50%;
            /* transform: rotate(360deg); */
        }
        .box:nth-of-type(5):hover{
            /* 线性渐变 */
            background: linear-gradient(#000,#fff);
        }
        .box:nth-of-type(6):hover{
            /* 径向渐变 */
            background: radial-gradient(#fff,#000);
        }
        /* 相邻兄弟选择器 */
        /* ~兄弟选择器 */
        .box:nth-of-type(6)+.box:hover{
            transform:scale(0.5);
        }
        .box:nth-of-type(8):hover{
            transform: translateX(-100px);
        }
        .box:nth-of-type(9):hover{
            transform: rotateZ(-180deg);
        }
        .box:nth-of-type(10):hover{
            transform: skewX(-45deg);
        }
        .box:nth-last-child(2):hover::before{
            content:"#";
            color:red;
        }
        /* 最后一个 */
        .box:last-child:hover::after{
            content:"侯雅月";
            color:#fff;
            font-size: 15px;
            display: block;
            width:50px;
            height:40px;
            margin:10px;
            /* 扩展：黑底白字居中圆角你的名字 */
            background-color: #000;
            border-radius: 50%;
        }
        .box:nth-of-type(3n):hover{
            border: 3px solid #f00;
        }
        /*扩展：鼠标在偶数个盒子上时有变化，变化效果自定义*/
        /* :nth-child(even) 选中第2、4、6、8、10、12个盒子 */
        .box:nth-child(even):hover{
            /* 文字变蓝 */
            color:#0a84ff;
            /* 背景变色（浅蓝） */
            background-color: #eaf3ff;
            /* 虚线外框，outline-offset 让框和盒子之间留点空隙 */
            outline: 4px dashed #0a84ff;
            outline-offset: 4px;
            /* 外发光，filter 不会和上面 box-shadow、transform 的效果冲突 */
            filter: drop-shadow(0 0 18px rgba(10,132,255,0.9));
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
